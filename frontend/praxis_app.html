<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRAXIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#0b1220; --ink-2:#0f1830; --ink-3:#16233c; --ink-4:#1c2a46; --ink-5:#212f4d;
  --gold:#c9a24b; --gold-hi:#dcb968; --gold-pale:#e8d9ae; --parchment:#f3efe6; --slate:#8a93a6; --slate-dim:#5f6c85;
  --line:rgba(201,162,75,0.16); --line-soft:rgba(201,162,75,0.09); --red:#c15b4a; --red-soft:#e08a77; --green:#7fae7a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28), 0 1px 1px rgba(0,0,0,.2);
  --shadow-md:0 10px 30px -8px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.25);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.55);
  --focus-ring:0 0 0 3px rgba(201,162,75,0.28);
  --ease:cubic-bezier(.22,.61,.36,1);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ink-2);color:var(--parchment);font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.012em;line-height:1.15;}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:"tnum" 1;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:rgba(201,162,75,0.32);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:6px;border:2px solid var(--ink-2);}
::-webkit-scrollbar-thumb:hover{background:var(--ink-5);}
a,button,input,select,textarea,tr.clickable,.list-item,.nav-item{transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .16s var(--ease);}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:3px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:0.001ms !important;animation-duration:0.001ms !important;}}

#login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);background-image:radial-gradient(680px 460px at 82% 8%, rgba(201,162,75,0.11), transparent 62%),radial-gradient(500px 500px at 4% 96%, rgba(201,162,75,0.05), transparent 60%);position:relative;}
.login-card{width:410px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:44px 40px;box-shadow:var(--shadow-lg);position:relative;z-index:1;animation:cardIn .5s var(--ease);}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:34px;}
.brand-mark{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;color:var(--gold);font-size:22px;box-shadow:0 0 0 4px rgba(201,162,75,0.07),inset 0 0 12px rgba(201,162,75,0.08);}
.login-brand h1{font-size:23px;color:#fff;letter-spacing:0.01em;}
.login-tabs{display:flex;gap:3px;margin-bottom:26px;background:var(--ink-3);border-radius:5px;padding:4px;border:1px solid var(--line-soft);}
.login-tabs button{flex:1;background:transparent;border:none;color:var(--slate);padding:9px;border-radius:3px;font-size:13px;font-weight:500;}
.login-tabs button:hover:not(.active){color:var(--parchment);}
.login-tabs button.active{background:var(--gold);color:var(--ink);box-shadow:var(--shadow-sm);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.07em;font-weight:500;}
.field input, .field select, .field textarea{width:100%;background:var(--ink-3);border:1px solid var(--line);border-radius:4px;color:var(--parchment);padding:10px 12px;font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.2);}
.field input::placeholder, .field textarea::placeholder{color:var(--slate-dim);}
.field input:hover, .field select:hover, .field textarea:hover{border-color:rgba(201,162,75,0.32);}
.field input[type=file]{padding:8px 10px;}
.field input[type=file]::file-selector-button{background:var(--ink-4);border:1px solid var(--line);color:var(--parchment);padding:7px 13px;border-radius:3px;font-size:12.5px;font-weight:500;margin-right:12px;cursor:pointer;transition:background .16s var(--ease);}
.field input[type=file]::file-selector-button:hover{background:var(--ink-5);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--focus-ring);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:4px;font-size:13.5px;font-weight:600;border:1px solid var(--gold);background:var(--gold);color:var(--ink);width:100%;letter-spacing:0.005em;}
.btn:hover{background:var(--gold-hi);border-color:var(--gold-hi);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-ghost{background:transparent;color:var(--gold-pale);border-color:transparent;}
.btn-ghost:hover{background:rgba(201,162,75,0.09);border-color:transparent;transform:none;box-shadow:none;}
.btn-sm{width:auto;padding:7px 14px;font-size:12.5px;}
.btn-danger{border-color:var(--red);color:var(--red-soft);background:transparent;}
.btn-danger:hover{background:rgba(193,91,74,0.12);border-color:var(--red);color:var(--red-soft);box-shadow:none;transform:none;}
.login-hint{font-size:12px;color:var(--slate);text-align:center;margin-top:18px;}
.error-msg{background:rgba(193,91,74,0.13);border:1px solid rgba(193,91,74,0.5);color:var(--red-soft);padding:10px 13px;border-radius:4px;font-size:13px;margin-bottom:14px;}

#app-screen{display:none;height:100vh;grid-template-columns:232px 1fr;}
#app-screen.active{display:grid;}
.sidebar{background:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 14px;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.sidebar .brand .brand-mark{width:30px;height:30px;font-size:14px;box-shadow:none;}
.sidebar .brand-name{font-family:'Fraunces',serif;font-size:16px;color:#fff;letter-spacing:0.01em;}
.sidebar .brand-name b{color:var(--gold);}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:5px;color:var(--slate);font-size:13.5px;font-weight:500;margin-bottom:1px;border:none;border-left:2px solid transparent;background:transparent;width:100%;text-align:left;}
.nav-item .ic{width:18px;text-align:center;font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:11px;opacity:.55;letter-spacing:0.02em;}
.nav-item:hover{background:var(--ink-3);color:var(--parchment);}
.nav-item:hover .ic{opacity:.85;}
.nav-item.active{background:var(--ink-3);color:#fff;border-left-color:var(--gold);padding-left:10px;box-shadow:inset 0 0 0 1px var(--line-soft);}
.nav-item.active .ic{opacity:1;}
.nav-sep{height:1px;background:var(--line);margin:14px 6px;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 6px;margin-bottom:10px;}
.user-avatar{width:31px;height:31px;border-radius:50%;background:var(--ink-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:12px;font-weight:600;flex:none;}
.user-name{font-size:13px;color:var(--parchment);font-weight:500;}
.user-role{font-size:10.5px;color:var(--slate);text-transform:uppercase;letter-spacing:0.06em;margin-top:1px;}
.badge-count{background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:auto;font-family:'IBM Plex Mono',monospace;}

.main{overflow-y:auto;padding:36px 44px 56px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;}
.page-head h2{font-size:27px;color:#fff;}
.page-head .sub{color:var(--gold-pale);opacity:.75;font-size:11px;margin-top:7px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.09em;}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px;}
.metric{background:var(--ink-3);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:0 0 6px 6px;padding:17px 20px 19px;box-shadow:var(--shadow-sm);}
.metric .v{font-family:'IBM Plex Mono',monospace;font-size:25px;color:#fff;font-weight:500;letter-spacing:-0.01em;}
.metric .l{font-size:11.5px;color:var(--slate);margin-top:6px;letter-spacing:0.01em;}
.panel{background:var(--ink-3);border:1px solid var(--line);border-radius:7px;padding:24px 26px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.panel h3{font-size:15.5px;color:#fff;margin-bottom:18px;font-weight:500;letter-spacing:0.005em;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--slate-dim);padding:0 12px 10px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:13px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--slate);}
td.t-primary{color:var(--parchment);font-weight:500;}
tr:last-child td{border-bottom:none;}
tr.clickable{cursor:pointer;position:relative;}
tr.clickable td:first-child{box-shadow:inset 2px 0 0 transparent;transition:box-shadow .16s var(--ease),background .16s var(--ease),color .16s var(--ease);}
tr.clickable:hover td{background:var(--ink-4);}
tr.clickable:hover td:first-child{box-shadow:inset 2px 0 0 var(--gold);}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:0.03em;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;}
.tag-alta{background:rgba(193,91,74,0.16);color:var(--red-soft);}
.tag-media{background:rgba(201,162,75,0.16);color:var(--gold-pale);}
.tag-baixa{background:rgba(127,174,122,0.16);color:var(--green);}
.tag-status{background:var(--ink-4);color:var(--slate);}
.tag-atrasado{background:rgba(193,91,74,0.22);color:var(--red-soft);}

.split{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
.list-item{padding:13px 18px;border-bottom:1px solid var(--line-soft);border-left:2px solid transparent;cursor:pointer;}
.list-item:hover{background:var(--ink-4);}
.list-item.active{background:var(--ink-4);border-left-color:var(--gold);}
.list-item .name{font-size:14px;color:var(--parchment);font-weight:500;}
.list-item .meta{font-size:11.5px;color:var(--slate);margin-top:3px;font-family:'IBM Plex Mono',monospace;}
.search-box{background:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:11px 14px;margin-bottom:16px;color:var(--parchment);width:100%;font-size:13.5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.2);}
.search-box::placeholder{color:var(--slate-dim);}
.search-box:focus{outline:none;border-color:var(--gold);box-shadow:var(--focus-ring);}
.empty{color:var(--slate-dim);font-size:13px;padding:30px 0;text-align:center;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.detail-head h3{font-size:20px;color:#fff;}
.detail-head .case{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);margin-top:5px;letter-spacing:0.02em;}
.inner-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
.inner-tab{background:transparent;border:none;color:var(--slate);padding:10px 14px;font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;}
.inner-tab:hover{color:var(--parchment);}
.inner-tab.active{color:var(--gold-pale);border-bottom-color:var(--gold);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.kv{background:var(--ink-4);border-radius:5px;padding:13px 15px;}
.kv .k{font-size:10.5px;color:var(--slate-dim);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.kv .val{font-size:14px;color:var(--parchment);margin-top:4px;}
.comment{padding:13px 0;border-bottom:1px dashed var(--line);}
.comment .who{font-size:12.5px;color:var(--gold-pale);font-weight:600;}
.comment .when{font-size:11px;color:var(--slate-dim);margin-left:8px;}
.comment .txt{font-size:13.5px;margin-top:5px;color:var(--parchment);line-height:1.55;}
.notice-card{background:var(--ink-3);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 7px 7px 0;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;box-shadow:var(--shadow-sm);}
.notice-card .msg{background:var(--ink-4);border-radius:5px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--parchment);white-space:pre-line;line-height:1.55;}
.checklist{max-height:160px;overflow-y:auto;background:var(--ink-4);border-radius:5px;padding:10px 14px;}
.checklist label{display:block;font-size:13px;padding:5px 0;font-weight:400;text-transform:none;color:var(--parchment);}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px;align-items:end;}
.inline-form .field{margin-bottom:0;}
.toast{position:fixed;bottom:26px;right:26px;background:var(--ink-3);border:1px solid var(--gold);color:var(--parchment);padding:12px 18px;border-radius:5px;font-size:13px;z-index:200;box-shadow:var(--shadow-md);animation:toastIn .25s var(--ease);}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.modal-overlay{position:fixed;inset:0;background:rgba(6,9,18,0.68);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(1.5px);}
.modal-overlay.active{display:flex;animation:overlayIn .15s var(--ease);}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.modal-box{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:30px;width:460px;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .2s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-box h3{color:#fff;font-size:18.5px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.modal-actions{display:flex;gap:10px;margin-top:10px;}
.modal-actions .btn-ghost{border:1px solid var(--line);}

@media (max-width:900px){.split{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">&sect;</div>
      <h1><b style="color:var(--gold)">PRAXIS</b></h1>
    </div>
    <div id="login-error"></div>
    <div class="login-tabs">
      <button class="active" onclick="setLoginTab('entrar')" id="tab-entrar">Entrar</button>
      <button onclick="setLoginTab('criar')" id="tab-criar">Criar escritório</button>
    </div>

    <div id="login-form-entrar">
      <div class="field"><label>E-mail</label><input type="email" id="login-email"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-senha"></div>
      <button class="btn" onclick="entrar()">Entrar</button>
    </div>

    <div id="login-form-criar" style="display:none;">
      <div class="field"><label>Nome do escritório</label><input type="text" id="criar-escritorio" placeholder="Ex: Almeida & Souza Advocacia"></div>
      <div class="field"><label>Seu nome</label><input type="text" id="criar-nome"></div>
      <div class="field"><label>Seu e-mail</label><input type="email" id="criar-email"></div>
      <div class="field"><label>Senha</label><input type="password" id="criar-senha"></div>
      <button class="btn" onclick="criarEscritorio()">Criar escritório</button>
    </div>


  </div>
</div>

<div id="app-screen">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">&sect;</div><div class="brand-name">PRAXIS</div></div>
    <div id="nav-items"></div>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">U</div>
        <div><div class="user-name" id="user-name"></div><div class="user-role" id="user-role"></div></div>
      </div>
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="sair()">Sair</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
/* ============================================================
   CONFIG E ESTADO
   ============================================================ */
// Em localhost (abrindo o arquivo direto ou via servidor estático simples,
// enquanto a API roda separada na porta 8000), fala com localhost:8000.
// Em produção, o front e a API sao servidos pelo MESMO container/dominio
// (ver deploy), entao usa a propria origem, sem prefixo nenhum.
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8000'
  : window.location.origin;

let sessao = JSON.parse(localStorage.getItem('praxis_sessao') || 'null');

let currentView = 'painel';
let selectedProcesso = null;
let selectedCliente = null;
let processoTab = 'visao';
let equipeCache = [];

let stateClientes = [], stateProcessos = [], stateAgenda = [],
    stateAvisos = [], stateEquipe = [], statePainel = null,
    stateRelatorioMov = [], stateRelatorioParados = [];

let relatorioSubTab = 'movimentacoes';
let stateRelProdutividade = [];
let stateRelDistribuicao = null;
let stateRelPrazos = null;
let stateRelQualidade = null;
let stateRelClienteSelecionado = '';
let stateRelClienteHistorico = null;
let chartInstances = {};

/* ============================================================
   HELPERS
   ============================================================ */

function escapeHtml(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoeda(v){ if(v===null||v===undefined) return '—'; return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function tagImportancia(imp){ return `<span class="tag tag-${imp||'media'}">${(imp||'-').toUpperCase()}</span>`; }
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2600);
}
function openModal(html){ document.getElementById('modal-box').innerHTML = html; document.getElementById('modal-overlay').classList.add('active'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }

async function api(method, path, body){
  const headers = {};
  if(sessao) headers['Authorization'] = 'Bearer ' + sessao.token;
  const opts = { method, headers };
  if(body instanceof FormData){
    opts.body = body;
  } else if(body !== undefined){
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API_BASE + path, opts);
  if(res.status === 401){ sair(); throw new Error('Sessão expirada.'); }
  if(!res.ok){
    let msg = 'Erro na requisição (' + res.status + ')';
    try{ const j = await res.json(); msg = j.detail || msg; }catch(e){}
    throw new Error(msg);
  }
  const ct = res.headers.get('content-type') || '';
  if(ct.includes('application/json')) return res.json();
  return res;
}

/* Removido a pedido do usuário: nao guardar documentos/PDFs sensiveis no app */

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */

function setLoginTab(tab){
  document.getElementById('tab-entrar').classList.toggle('active', tab==='entrar');
  document.getElementById('tab-criar').classList.toggle('active', tab==='criar');
  document.getElementById('login-form-entrar').style.display = tab==='entrar' ? 'block' : 'none';
  document.getElementById('login-form-criar').style.display = tab==='criar' ? 'block' : 'none';
  document.getElementById('login-error').innerHTML = '';
}

function mostrarErroLogin(msg){
  document.getElementById('login-error').innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
}

async function entrar(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  if(!email || !senha){ mostrarErroLogin('Preencha e-mail e senha.'); return; }
  try{
    sessao = await api('POST', '/auth/login', {email, senha});
    localStorage.setItem('praxis_sessao', JSON.stringify(sessao));
    entrarComSessao();
  }catch(e){ mostrarErroLogin(e.message); }
}

async function criarEscritorio(){
  const nome_escritorio = document.getElementById('criar-escritorio').value.trim();
  const nome_usuario = document.getElementById('criar-nome').value.trim();
  const email = document.getElementById('criar-email').value.trim();
  const senha = document.getElementById('criar-senha').value;
  if(!nome_escritorio || !nome_usuario || !email || !senha){ mostrarErroLogin('Preencha todos os campos.'); return; }
  try{
    sessao = await api('POST', '/auth/criar-escritorio', {nome_escritorio, nome_usuario, email, senha});
    localStorage.setItem('praxis_sessao', JSON.stringify(sessao));
    entrarComSessao();
  }catch(e){ mostrarErroLogin(e.message); }
}

function entrarComSessao(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('user-name').textContent = sessao.usuario.nome;
  document.getElementById('user-role').textContent = sessao.usuario.perfil;
  document.getElementById('user-avatar').textContent = (sessao.usuario.nome.replace(/^Dr[a]?\.\s*/,'')[0] || 'U').toUpperCase();
  renderNav();
  navigate('painel');
}

function sair(){
  sessao = null;
  localStorage.removeItem('praxis_sessao');
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
}

window.addEventListener('DOMContentLoaded', () => { if(sessao) entrarComSessao(); });

   ============================================================ */

const NAV = [
  {id:'painel',label:'Painel',ic:'01'}, {id:'clientes',label:'Clientes',ic:'02'},
  {id:'processos',label:'Processos',ic:'03'}, {id:'agenda',label:'Agenda',ic:'04'},
  {id:'avisos',label:'Avisos',ic:'06'},
  {id:'buscar',label:'Buscar',ic:'07'},
];
const NAV_LIDER = [ {id:'equipe',label:'Equipe',ic:'08'}, {id:'relatorio',label:'Relatório',ic:'09'} ];

function renderNav(){
  const lider = sessao.usuario.perfil === 'lider';
  const all = lider ? [...NAV, {sep:true}, ...NAV_LIDER] : NAV;
  document.getElementById('nav-items').innerHTML = all.map(item=>{
    if(item.sep) return `<div class="nav-sep"></div>`;
    const badge = item.id==='avisos' && stateAvisos.length ? `<span class="badge-count">${stateAvisos.length}</span>` : '';
    return `<button class="nav-item ${currentView===item.id?'active':''}" onclick="navigate('${item.id}')">
      <span class="ic">${item.ic}</span><span>${item.label}</span>${badge}</button>`;
  }).join('');
}

async function navigate(view){
  currentView = view; selectedProcesso = null; selectedCliente = null;
  renderNav();
  document.getElementById('main').innerHTML = '<div class="empty">Carregando…</div>';
  try{
    if(view==='painel') statePainel = await api('GET','/painel');
    else if(view==='clientes') stateClientes = await api('GET','/clientes');
    else if(view==='processos') stateProcessos = await api('GET','/processos');
    else if(view==='agenda') stateAgenda = await api('GET','/agenda?incluir_concluidos=false');
    else if(view==='avisos') stateAvisos = await api('GET','/avisos');
    else if(view==='equipe') stateEquipe = await api('GET','/equipe');
    else if(view==='relatorio'){ relatorioSubTab='movimentacoes'; stateRelatorioMov = await api('GET','/relatorio/movimentacoes?ordenar_por=recente'); stateRelatorioParados = await api('GET','/relatorio/parados?ordem=mais_tempo'); }
    renderNav();
    render();
  }catch(e){
    document.getElementById('main').innerHTML = `<div class="empty">Erro ao carregar: ${escapeHtml(e.message)}</div>`;
  }
}

function render(){
  const main = document.getElementById('main');
  if(currentView==='painel') main.innerHTML = viewPainel();
  else if(currentView==='clientes') main.innerHTML = viewClientes();
  else if(currentView==='processos') main.innerHTML = selectedProcesso ? viewProcessoDetalhe() : viewProcessos();
  else if(currentView==='agenda') main.innerHTML = viewAgenda();
  else if(currentView==='avisos') main.innerHTML = viewAvisos();
  else if(currentView==='buscar') main.innerHTML = viewBuscar();
  else if(currentView==='equipe') main.innerHTML = viewEquipe();
  else if(currentView==='relatorio'){ main.innerHTML = viewRelatorio(); desenharGraficosRelatorio(); }
}

  if(sessao.usuario.perfil==='lider' && equipeCache.length===0) equipeCache = await api('GET','/equipe');

  const opcoesAtribuir = sessao.usuario.perfil==='lider'
    ? `<option value="">Não atribuir</option>${equipeCache.map(u=>`<option value="${u.id}">${escapeHtml(u.nome)}</option>`).join('')}`
    : `<option value="">Não atribuir</option><option value="${sessao.usuario.id}">Atribuir a mim</option>`;

  openModal(`
    <h3>Novo processo</h3>
    <form onsubmit="criarProcesso(event)">
      <div class="field"><label>Número CNJ</label><input name="numero_cnj" required></div>
      <div class="field"><label>Classe</label><input name="classe" required></div>
      <div class="field"><label>Assunto</label><input name="assunto"></div>
      <div class="grid-2">
        <div class="field"><label>Vara</label><input name="vara"></div>
        <div class="field"><label>Comarca</label><input name="comarca"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Status</label><select name="status">${['ativo','arquivado','suspenso','baixado'].map(s=>`<option>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Valor da causa</label><input name="valor_causa" type="number" step="0.01"></div>
      </div>
      <div class="field"><label>Sigla do tribunal (deixe em branco pra detectar automaticamente)</label><input name="sigla_tribunal" placeholder="ex: tjsp, trf1"></div>
      <div class="field"><label>Atribuir a</label><select name="atribuir">${opcoesAtribuir}</select></div>
      <div class="field"><label>Cliente(s) vinculado(s)</label>
        <div class="checklist">${stateClientes.map(c=>`<label><input type="checkbox" name="clientes" value="${c.id}"> ${escapeHtml(c.nome)}</label>`).join('') || 'Nenhum cliente cadastrado ainda.'}</div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn">Cadastrar</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      </div>
    </form>
  `);
}

async function criarProcesso(ev){
  ev.preventDefault(); const f = ev.target;
  const clientes_ids = [...f.querySelectorAll('input[name="clientes"]:checked')].map(i=>i.value);
  if(clientes_ids.length===0){ toast('Selecione ao menos um cliente.'); return; }
  const body = {
    numero_cnj: f.numero_cnj.value, classe: f.classe.value, assunto: f.assunto.value,
    vara: f.vara.value, comarca: f.comarca.value, status: f.status.value,
    valor_causa: f.valor_causa.value ? parseFloat(f.valor_causa.value) : null,
    sigla_tribunal: f.sigla_tribunal.value || null,
    atribuir_usuario_id: f.atribuir.value || null,
    clientes_ids,
  };
  try{
    const r = await api('POST', '/processos', body);
    closeModal();
    toast(r.tribunal_detectado ? `Processo cadastrado. Tribunal detectado: ${r.tribunal_detectado}.` : 'Processo cadastrado.');
    stateProcessos = await api('GET','/processos'); render();
  }catch(e){ toast(e.message); }
}

let buscaTimeout;
function fazerBusca(termo){
  clearTimeout(buscaTimeout);
  if(!termo){ document.getElementById('busca-resultados').innerHTML=''; return; }
  buscaTimeout = setTimeout(async ()=>{
    try{
      const r = await api('GET', `/buscar?termo=${encodeURIComponent(termo)}`);
      document.getElementById('busca-resultados').innerHTML = `
        <div class="panel"><h3>Clientes (${r.clientes.length})</h3>
          <table><thead><tr><th>Nome</th><th>CPF/CNPJ</th></tr></thead><tbody>
            ${r.clientes.map(c=>`<tr><td class="t-primary">${escapeHtml(c.nome)}</td><td class="mono">${escapeHtml(c.cpf_cnpj)}</td></tr>`).join('') || `<tr><td colspan="2" class="empty">Nada encontrado.</td></tr>`}
          </tbody></table></div>
        <div class="panel"><h3>Processos (${r.processos.length})</h3>
          <table><thead><tr><th>Número</th><th>Classe</th></tr></thead><tbody>
            ${r.processos.map(p=>`<tr><td class="mono t-primary">${escapeHtml(p.numero_cnj)}</td><td>${escapeHtml(p.classe)}</td></tr>`).join('') || `<tr><td colspan="2" class="empty">Nada encontrado.</td></tr>`}
          </tbody></table></div>`;
    }catch(e){ toast(e.message); }
  }, 300);
}

const RELATORIO_TABS = [
  ['movimentacoes','Movimentacoes'], ['parados','Parados'], ['produtividade','Produtividade'],
  ['distribuicao','Distribuicao'], ['cliente','Historico por cliente'],
  ['prazos','Prazos'], ['qualidade','Qualidade de dados'],
];

function fmtHoras(h){
  if(h===null || h===undefined) return '\u2014';
  if(h < 1) return Math.round(h*60) + ' min';
  return h.toFixed(1) + 'h';
}

function criarOuAtualizarChart(canvasId, config){
  if(chartInstances[canvasId]){ chartInstances[canvasId].destroy(); }
  const el = document.getElementById(canvasId);
  if(!el || typeof Chart === 'undefined') return;
  chartInstances[canvasId] = new Chart(el, config);
}

async function exportarRelatorioCSV(path, nomeArquivo){
  try{
    const res = await api('GET', path);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nomeArquivo; a.click();
    URL.revokeObjectURL(url);
  }catch(e){ toast('Erro ao exportar: ' + e.message); }
}

async function irParaSubAbaRelatorio(tab){
  relatorioSubTab = tab;
  render();
  try{
    if(tab==='produtividade' && stateRelProdutividade.length===0){
      stateRelProdutividade = await api('GET','/relatorio/produtividade');
    } else if(tab==='distribuicao' && !stateRelDistribuicao){
      stateRelDistribuicao = await api('GET','/relatorio/distribuicao');
    } else if(tab==='prazos' && !stateRelPrazos){
      stateRelPrazos = await api('GET','/relatorio/prazos');
    } else if(tab==='qualidade' && !stateRelQualidade){
      stateRelQualidade = await api('GET','/relatorio/qualidade');
    } else if(tab==='cliente' && stateClientes.length===0){
      stateClientes = await api('GET','/clientes');
    }
    render();
    desenharGraficosRelatorio();
  }catch(e){ toast(e.message); }
}

function desenharGraficosRelatorio(){
  if(currentView !== 'relatorio') return;

  if(relatorioSubTab==='distribuicao' && stateRelDistribuicao){
    const d = stateRelDistribuicao;
    const cores = ['#c9a24b','#e08a77','#7fae7a','#8a93a6','#dcb968','#e8d9ae'];
    criarOuAtualizarChart('chart-rel-status', {
      type: 'doughnut',
      data: { labels: d.por_status.map(x=>x.chave), datasets: [{ data: d.por_status.map(x=>x.total), backgroundColor: cores }] },
      options: { plugins: { legend: { labels: { color: '#f3efe6' } } } }
    });
    criarOuAtualizarChart('chart-rel-classe', {
      type: 'bar',
      data: { labels: d.por_classe.map(x=>x.chave), datasets: [{ label: 'Processos', data: d.por_classe.map(x=>x.total), backgroundColor: '#c9a24b' }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#8a93a6' } }, y: { ticks: { color: '#8a93a6' } } } }
    });
  }

  if(relatorioSubTab==='produtividade' && stateRelProdutividade.length){
    criarOuAtualizarChart('chart-rel-produtividade', {
      type: 'bar',
      data: { labels: stateRelProdutividade.map(x=>x.nome), datasets: [{ label: 'Movimentacoes no periodo', data: stateRelProdutividade.map(x=>x.movimentacoes_periodo), backgroundColor: '#c9a24b' }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#8a93a6' } }, y: { ticks: { color: '#8a93a6' } } } }
    });
  }

  if(relatorioSubTab==='prazos' && stateRelPrazos){
    const p = stateRelPrazos;
    const pendentes = Math.max(0, p.total - p.concluidos - p.atrasados);
    criarOuAtualizarChart('chart-rel-prazos', {
      type: 'doughnut',
      data: { labels: ['Concluidos','Atrasados','Pendentes no prazo'], datasets: [{ data: [p.concluidos, p.atrasados, pendentes], backgroundColor: ['#7fae7a','#c15b4a','#c9a24b'] }] },
      options: { plugins: { legend: { labels: { color: '#f3efe6' } } } }
    });
  }
}

function viewRelatorio(){
  const tabsHtml = RELATORIO_TABS.map(([id,label])=>
    `<button class="inner-tab ${relatorioSubTab===id?'active':''}" onclick="irParaSubAbaRelatorio('${id}')">${label}</button>`
  ).join('');

  let corpo = '';
  if(relatorioSubTab==='movimentacoes') corpo = relatorioMovimentacoesHTML();
  else if(relatorioSubTab==='parados') corpo = relatorioParadosHTML();
  else if(relatorioSubTab==='produtividade') corpo = relatorioProdutividadeHTML();
  else if(relatorioSubTab==='distribuicao') corpo = relatorioDistribuicaoHTML();
  else if(relatorioSubTab==='cliente') corpo = relatorioClienteHTML();
  else if(relatorioSubTab==='prazos') corpo = relatorioPrazosHTML();
  else if(relatorioSubTab==='qualidade') corpo = relatorioQualidadeHTML();

  return `
    <div class="page-head"><div><h2>Relatorio</h2><div class="sub">Analises do escritorio</div></div></div>
    <div class="inner-tabs">${tabsHtml}</div>
    ${corpo}
  `;
}

      <div class="metric"><div class="v">${p.atrasados}</div><div class="l">Atrasados</div></div>
    </div>
    <div class="panel">
      <div style="position:relative;height:240px;"><canvas id="chart-rel-prazos"></canvas></div>
    </div>
    <div class="panel" style="padding:0;">
      <table><thead><tr><th>Tipo</th><th>Total</th><th>Concluidos</th></tr></thead><tbody>
        ${p.por_tipo.map(t=>`<tr><td class="t-primary">${escapeHtml(t.tipo)}</td><td class="mono">${t.total}</td><td class="mono">${t.concluidos}</td></tr>`).join('') || `<tr><td colspan="3" class="empty">Sem dados.</td></tr>`}
      </tbody></table>
    </div>
    ${p.por_advogado.length ? `
    <div class="panel" style="padding:0;">
      <table><thead><tr><th>Advogado</th><th>Total</th><th>Atrasados</th></tr></thead><tbody>
        ${p.por_advogado.map(a=>`<tr><td class="t-primary">${escapeHtml(a.advogado_nome)}</td><td class="mono">${a.total}</td><td class="mono">${a.atrasados}</td></tr>`).join('')}
      </tbody></table>
    </div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="exportarRelatorioCSV('/relatorio/prazos?formato=csv','prazos.csv')">Exportar CSV</button>
    </div>`;
}

function relatorioQualidadeHTML(){
  if(!stateRelQualidade) return `<div class="empty">Carregando...</div>`;
  const q = stateRelQualidade;
  return `
    <div class="metrics">
      <div class="metric"><div class="v">${q.sem_tribunal.length}</div><div class="l">Sem tribunal (fora do DataJud)</div></div>
      <div class="metric"><div class="v">${q.sem_advogado.length}</div><div class="l">Sem advogado atribuido</div></div>
      <div class="metric"><div class="v">${q.sem_movimentacao.length}</div><div class="l">Sem nenhuma movimentacao</div></div>
    </div>
    <div class="grid-2">
      <div class="panel"><h3>Sem tribunal</h3>
        ${q.sem_tribunal.map(n=>`<div class="mono" style="padding:4px 0;">${escapeHtml(n)}</div>`).join('') || `<div class="empty">Nenhum.</div>`}
      </div>
      <div class="panel"><h3>Sem advogado</h3>
        ${q.sem_advogado.map(n=>`<div class="mono" style="padding:4px 0;">${escapeHtml(n)}</div>`).join('') || `<div class="empty">Nenhum.</div>`}
      </div>
    </div>
    <div class="panel"><h3>Sem nenhuma movimentacao</h3>
      ${q.sem_movimentacao.map(n=>`<div class="mono" style="padding:4px 0;">${escapeHtml(n)}</div>`).join('') || `<div class="empty">Nenhum.</div>`}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="exportarRelatorioCSV('/relatorio/qualidade?formato=csv','qualidade_dados.csv')">Exportar CSV</button>
    </div>`;
}
</script>
